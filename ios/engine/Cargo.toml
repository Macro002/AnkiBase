[package]
name = "ankibase-engine"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The AnkiBase iPhone app's core: Anki's engine on the device, and the app's routing"
publish = false

[lib]
# The apps build the library they need: ios/scripts/build.sh a staticlib, android/scripts/build.sh
# a cdylib (libankibase_engine.so), with `cargo rustc --crate-type`.
crate-type = ["rlib"]

[dependencies]
# Anki's own Rust library, at the same release the server runs.
anki = { git = "https://github.com/ankitects/anki.git", tag = "26.09.3", features = ["rustls"] }
anki_proto = { git = "https://github.com/ankitects/anki.git", tag = "26.09.3" }
reqwest = { version = "0.12.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.45", features = ["rt-multi-thread"] }
percent-encoding = "2"
base64 = "0.22"
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
httpdate = "1"
prost = "0.13"
regex = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Android has no system certificate store rustls can read: use Mozilla's roots there.
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = "s"
strip = "debuginfo"
