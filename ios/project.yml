# AnkiBase.xcodeproj, for building to an iPhone from Xcode on a Mac: scripts/xcode.sh makes
# it with XcodeGen. The app is this folder's Swift package (Package.swift, which xtool builds
# on Linux); this project only wraps it in an app target that Xcode can sign and run.
name: AnkiBase
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  AnkiBase:
    path: .
targets:
  AnkiBase:
    type: application
    platform: iOS
    configFiles:
      Debug: .build/xcode/Local.xcconfig
      Release: .build/xcode/Local.xcconfig
    sources:
      - path: .build/xcode/Assets.xcassets
        name: Assets.xcassets (made by scripts/xcode.sh)
    dependencies:
      - package: AnkiBase
        product: AnkiBase
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: AnkiBase
        # The package's module is AnkiBase; the app target's mustn't clash with it.
        PRODUCT_MODULE_NAME: AnkiBaseApp
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        # The app's code is the package's, linked into the app. Xcode's debug dylib (for
        # SwiftUI previews) would hold it instead, and goes unsigned on the phone.
        ENABLE_DEBUG_DYLIB: NO
        # The scripts below read local.env and edit the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Check scripts/xcode.sh prepare
        basedOnDependencyAnalysis: false
        script: |
          if [ "$(cat "$SRCROOT/.build/xcode/prepare.status" 2>/dev/null)" != 0 ]; then
            echo "error: scripts/xcode.sh prepare failed (the scheme's pre-action). The end of .build/xcode/prepare.log:"
            tail -40 "$SRCROOT/.build/xcode/prepare.log"
            exit 1
          fi
    postBuildScripts:
      - name: This build's server and update feed (local.env)
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ -f "$SRCROOT/local.env" ]; then set -a; . "$SRCROOT/local.env"; set +a; fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          plutil -replace AnkiBaseServer -string "${ANKIBASE_SERVER:-}" "$plist"
          plutil -replace AnkiBaseUpdateFeed -string "${ANKIBASE_UPDATE_FEED:-}" "$plist"
schemes:
  AnkiBase:
    build:
      targets:
        AnkiBase: all
      preActions:
        - name: scripts/xcode.sh prepare
          settingsTarget: AnkiBase
          # Without Xcode's environment, which is meant for the app, not for the engine's
          # build. Xcode doesn't stop on a failing pre-action: the target's first script does.
          script: |
            out="$SRCROOT/.build/xcode"
            mkdir -p "$out" && rm -f "$out/prepare.status"
            env -i HOME="$HOME" USER="$USER" LOGNAME="$LOGNAME" TMPDIR="$TMPDIR" LANG=en_US.UTF-8 \
              "$SRCROOT/scripts/xcode.sh" prepare > "$out/prepare.log" 2>&1
            echo $? > "$out/prepare.status"
    run:
      config: Debug
    archive:
      config: Release
