[package]
name = "ankibase-desktop"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "AnkiBase for Windows, macOS and Linux: the app's core in a native window"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
# The same core as the phone apps: Anki's engine and the app's routing, served on 127.0.0.1.
ankibase-engine = { path = "../ios/engine" }
tauri = { version = "=2.12.3", features = [] }
open = "5.4.4"
getrandom = "0.3.4"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = "s"
strip = "debuginfo"
