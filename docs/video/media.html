<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
  :root { --accent: #e94560; --accent2: #ff8a7a; --ink: #f3f1ff; --muted: #a9a8c7; }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; background: transparent }
  .board { position: relative; overflow: hidden }
  .bg { background: #0d0e1f }
  .bg::before { content: ""; position: absolute; inset: 0; background:
      radial-gradient(900px 700px at 8% -10%, rgba(233,69,96,.32), transparent 60%),
      radial-gradient(900px 700px at 100% 110%, rgba(72,92,255,.28), transparent 60%),
      radial-gradient(600px 500px at 60% 40%, rgba(255,170,110,.08), transparent 60%) }
  .bg::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.3px); background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at center, #000 35%, transparent 85%) }
  .bg > * { position: relative; z-index: 1 }
  .abs { position: absolute }
  .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; background: linear-gradient(100deg, var(--accent), var(--accent2));
           -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .06em }
  .browser { border-radius: 16px; overflow: hidden; background: #101126; border: 1px solid rgba(255,255,255,.12);
             box-shadow: 0 40px 80px -24px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.25) }
  .bar { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: #15162e; border-bottom: 1px solid rgba(255,255,255,.06) }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57 } .bar i:nth-child(2) { background: #febc2e } .bar i:nth-child(3) { background: #28c840 }
  .url { margin-left: 14px; flex: 1; max-width: 460px; height: 24px; border-radius: 7px; background: rgba(255,255,255,.06); font: 500 13px/24px Inter; color: #9a99bb; padding-left: 12px }
  .browser img { display: block; width: 100% }
  .phone { width: 300px; height: 649px; border-radius: 48px; padding: 10px; background: linear-gradient(160deg, #2a2b45, #0b0b16);
           box-shadow: 0 40px 80px -24px rgba(0,0,0,.6), inset 0 0 0 1.5px rgba(255,255,255,.12) }
  .phone .scr { width: 100%; height: 100%; border-radius: 39px; overflow: hidden; position: relative; background: #000 }
  .phone img { width: 100%; display: block }
  .phone .notch { position: absolute; top: 11px; left: 50%; width: 96px; height: 28px; margin-left: -48px; border-radius: 20px; background: #000; z-index: 2 }
  .tile { border-radius: 14px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 24px 50px -18px rgba(0,0,0,.6) }
  .tile img { width: 100%; display: block }
  .tile span { position: absolute; left: 12px; bottom: 10px; font: 600 14px/1 Inter; padding: 7px 11px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff }
  .chip { font: 500 16px/1 Inter; padding: 10px 15px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); color: #dedcf5 }
  .logo { fill: var(--accent); filter: drop-shadow(0 0 30px rgba(233,69,96,.5)) }
</style>
</head>
<body>

c-.421.042-.933.135-1.324.141c-.51.008-.867-.177-1.011-.435c-.142-.257-.11-.659.167-1.088c.212-.328.563-.713.822-1.047c.08-.104.171-.256.202-.305"/></defs></svg>

<!-- hero / social preview -->
<div class="board bg" id="hero" style="width:1280px;height:640px">
  <div class="abs" style="left:72px;top:150px;width:520px">
    <div style="display:flex;align-items:center;gap:16px"><svg class="logo" viewBox="0 0 24 24" width="64" height="64"><use href="#star"/></svg>
      <span style="font:800 66px/1 Inter;letter-spacing:-.05em">AnkiBase</span></div>
    <div style="font:700 44px/1.1 Inter;letter-spacing:-.03em;margin-top:34px">Anki, Quizlet and AI,<br><span class="serif" style="font-size:54px">on your own server.</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:34px;width:500px">
      <span class="chip">Any Anki deck</span><span class="chip">7 Quizlet modes</span><span class="chip">AI stories</span><span class="chip">Stats</span><span class="chip">Self-hosted</span>
    </div>
  </div>
  <div class="abs browser" style="left:640px;top:96px;width:720px;transform:perspective(2000px) rotateY(-9deg) rotateX(3deg);transform-origin:0 50%">
    <div class="bar"><i></i><i></i><i></i><div class="url">ankibase.home</div></div><img src="shots/reading.png"></div>
  <div class="abs phone" style="left:1040px;top:250px;transform:scale(.62) rotate(4deg);transform-origin:0 0"><div class="scr"><div class="notch"></div><img src="shots/m-study.png"></div></div>
</div>

<!-- framed screenshot (transparent) -->
<div class="board" id="framed" style="width:1360px;padding:40px 40px 70px">
  <div class="browser"><div class="bar"><i></i><i></i><i></i><div class="url" id="framed-url">ankibase.home</div></div><img id="framed-img"></div>
</div>

<!-- themes -->
<div class="board bg" id="themes" style="width:1280px;height:820px">
  <div style="position:absolute;left:0;right:0;top:44px;text-align:center">
    <div style="font:600 14px/1 Inter;letter-spacing:.28em;color:var(--accent);text-transform:uppercase">9 built-in themes · custom accents · import / export</div>
    <div style="font:700 50px/1 Inter;letter-spacing:-.035em;margin-top:18px">Make it <span class="serif" style="font-size:60px">yours.</span></div>
  </div>
  <div id="themes-grid" style="position:absolute;left:48px;right:48px;top:180px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px"></div>
</div>

<!-- phones -->
<div class="board bg" id="phones" style="width:1280px;height:820px">
  <div class="abs phone" style="left:150px;top:110px;transform:rotate(-4deg)"><div class="scr"><div class="notch"></div><img src="shots/m-study.png"></div></div>
  <div class="abs phone" style="left:490px;top:80px"><div class="scr"><div class="notch"></div><img src="shots/m-reading.png"></div></div>
  <div class="abs phone" style="left:830px;top:110px;transform:rotate(4deg)"><div class="scr"><div class="notch"></div><img src="shots/m-learn.png"></div></div>
</div>

<!-- architecture -->

    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8db5"/></marker>
      <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#e94560"/><stop offset="1" stop-color="#ff8a7a"/></linearGradient>
    </defs>
    <text x="64" y="74" font-size="14" font-weight="600" letter-spacing="3.8" fill="#e94560">HOW IT FITS TOGETHER</text>
    <text x="64" y="118" font-size="38" font-weight="700" fill="#f3f1ff" letter-spacing="-1">One server. Your data stays on it.</text>

    <!-- browser -->
    <g transform="translate(64,250)">
      <rect width="230" height="200" rx="18" fill="#15162e" stroke="rgba(255,255,255,.14)"/>
      <circle cx="22" cy="22" r="5" fill="#ff5f57"/><circle cx="38" cy="22" r="5" fill="#febc2e"/><circle cx="54" cy="22" r="5" fill="#28c840"/>
      <text x="22" y="80" font-size="22" font-weight="700" fill="#f3f1ff">Browser</text>
      <text x="22" y="108" font-size="15" fill="#a9a8c7">desktop or phone</text>
      <text x="22" y="150" font-size="14" fill="#cfcde8">React 19 · Vite</text>
      <text x="22" y="172" font-size="14" fill="#cfcde8">Tailwind v4</text>
    </g>
    <!-- server -->
    <g transform="translate(400,180)">
      <rect width="440" height="340" rx="22" fill="rgba(233,69,96,.07)" stroke="url(#acc)" stroke-width="2"/>
      <use href="#star" transform="translate(26,24) scale(1.4)" fill="#e94560"/>
      <text x="70" y="50" font-size="22" font-weight="700" fill="#f3f1ff">AnkiBase server</text>
      <text x="70" y="74" font-size="14" fill="#a9a8c7">FastAPI · one systemd service</text>
      <g transform="translate(26,104)">
        <rect width="186" height="96" rx="14" fill="#15162e" stroke="rgba(255,255,255,.1)"/>
        <text x="16" y="34" font-size="16" font-weight="600" fill="#f3f1ff">Study &amp; reviewer</text>
        <text x="16" y="58" font-size="13" fill="#a9a8c7">sandboxed card frames</text>
        <text x="16" y="78" font-size="13" fill="#a9a8c7">signed media URLs</text>
      </g>
      <g transform="translate(228,104)">
        <rect width="186" height="96" rx="14" fill="#15162e" stroke="rgba(255,255,255,.1)"/>
        <text x="16" y="34" font-size="16" font-weight="600" fill="#f3f1ff">Quizlet engine</text>
        <text x="16" y="58" font-size="13" fill="#a9a8c7">Learn · Test · games</text>
        <text x="16" y="78" font-size="13" fill="#a9a8c7">sessions you resume</text>
      </g>
      <g transform="translate(26,216)">
        <rect width="186" height="96" rx="14" fill="#15162e" stroke="rgba(255,255,255,.1)"/>
        <text x="16" y="34" font-size="16" font-weight="600" fill="#f3f1ff">Stories &amp; reading</text>
        <text x="16" y="58" font-size="13" fill="#a9a8c7">AI annotations</text>
        <text x="16" y="78" font-size="13" fill="#a9a8c7">dictionary lookups</text>
      </g>
      <g transform="translate(228,216)">
        <rect width="186" height="96" rx="14" fill="#15162e" stroke="rgba(255,255,255,.1)"/>
        <text x="16" y="34" font-size="16" font-weight="600" fill="#f3f1ff">SQLite</text>
        <text x="16" y="58" font-size="13" fill="#a9a8c7">users, sets, stories,</text>
        <text x="16" y="78" font-size="13" fill="#a9a8c7">encrypted API keys</text>
      </g>
    </g>
    <!-- anki engine -->
    <g transform="translate(950,150)">
      <rect width="266" height="190" rx="18" fill="#15162e" stroke="rgba(255,255,255,.14)"/>
      <text x="22" y="46" font-size="20" font-weight="700" fill="#f3f1ff">Anki engine</text>
      <text x="22" y="72" font-size="14" fill="#a9a8c7">anki-cli · one service</text>
      <text x="22" y="112" font-size="14" fill="#cfcde8">Anki's own scheduler (Rust core)</text>
      <text x="22" y="136" font-size="14" fill="#cfcde8">a collection per account</text>
      <text x="22" y="160" font-size="14" fill="#cfcde8">media folder &amp; backups</text>
    </g>
    <g transform="translate(950,400)">
      <rect width="266" height="72" rx="16" fill="#15162e" stroke="rgba(255,255,255,.14)"/>

      <rect width="266" height="88" rx="16" fill="#15162e" stroke="rgba(255,255,255,.14)"/>
      <text x="22" y="32" font-size="17" font-weight="700" fill="#f3f1ff">AI provider (optional)</text>
      <text x="22" y="56" font-size="13" fill="#a9a8c7">Claude · ChatGPT · Gemini</text>
      <text x="22" y="74" font-size="13" fill="#a9a8c7">your own API key</text>
    </g>
    <!-- arrows -->
    <path d="M300 350 H392" stroke="#8f8db5" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <text x="312" y="338" font-size="12" fill="#8f8db5">HTTPS</text>
    <path d="M846 260 H942" stroke="#8f8db5" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <text x="856" y="248" font-size="12" fill="#8f8db5">AnkiConnect</text>

    <text x="64" y="640" font-size="15" fill="#a9a8c7">Everything except the optional AI calls and AnkiWeb sync runs on your machine.</text>
  </svg>
</div>

<script>
const q = new URLSearchParams(location.search);
const show = q.get('b');
document.querySelectorAll('.board').forEach(b => b.style.display = b.id === show ? '' : 'none');
if (show === 'framed') { document.getElementById('framed-img').src = 'shots/' + q.get('img') + '.png'; document.getElementById('framed-url').textContent = 'ankibase.home' + (q.get('url') || ''); }
const T = [['study', 'ankibase', 'AnkiBase'], ['decks', 'chalk', 'Chalk'], ['study', 'nord', 'Nord'], ['decks', 'sakura', 'Sakura'], ['study', 'claude', 'Claude'], ['decks', 'ocean', 'Ocean']];
document.getElementById('themes-grid').innerHTML = T.map(([k, f, n]) => `<div class="tile"><img src="shots/theme-${k}-${f}.png"><span>${n}</span></div>`).join('');
</script>
</body>
</html>
